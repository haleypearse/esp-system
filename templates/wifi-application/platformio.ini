; Standard Wi-Fi application template. Select the actual board and matching partition table.
[env:esp32dev]
platform = espressif32 @ ^6.12.0
board = esp32dev                 ; change to the actual board definition
framework = arduino
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
board_build.partitions = partitions/ota_4mb.csv

lib_deps =
    https://github.com/haleypearse/esp-system.git#v0.2.0
