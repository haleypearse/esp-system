name: Build ESP System projects

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Wi-Fi bootstrap against repository source
        run: pio run -d bootstrap/wifi-ota
      - name: Build Wi-Fi application template against repository source
        run: |
          sed -i 's|https://github.com/haleypearse/esp-system.git#v0.2.0|file://../..|' templates/wifi-application/platformio.ini
          pio run -d templates/wifi-application
      - name: Validate update tools
        run: python -m py_compile tools/make_manifest.py tools/serve_updates.py tools/check_partitions.py
      - name: Check 4 MiB partition table bounds
        run: python tools/check_partitions.py partitions/ota_4mb.csv --flash-size 0x400000
      - name: Check 8 MiB partition table bounds
        run: python tools/check_partitions.py partitions/ota_8mb.csv --flash-size 0x800000
      - name: Check template partition tables
        run: |
          python tools/check_partitions.py templates/wifi-application/partitions/ota_4mb.csv --flash-size 0x400000
          python tools/check_partitions.py templates/wifi-application/partitions/ota_8mb.csv --flash-size 0x800000
          cmp partitions/ota_4mb.csv templates/wifi-application/partitions/ota_4mb.csv
          cmp partitions/ota_8mb.csv templates/wifi-application/partitions/ota_8mb.csv
      - name: Check patch whitespace
        run: git diff --check
