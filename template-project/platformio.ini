; Copy this folder as the starting point for a new application.
; For a released project, replace the local ../../ dependency with a Git tag:
; lib_deps = https://github.com/YOUR_GITHUB_USER/esp-system.git#v0.1.0

[env:esp32dev]
platform = espressif32 @ ^6.12.0
board = esp32dev                 ; change to the actual board definition
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/ota_4mb.csv

lib_deps =
    ; Replace YOUR_GITHUB_USER with your GitHub account.
    https://github.com/haleypearse/esp-system.git ;#v0.1.0
